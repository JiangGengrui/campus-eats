<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>确认订单 · 校味</title>
<meta name="description" content="校味确认订单页视觉稿：选择收货地址、填写备注、核对订单摘要后模拟支付。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+QingKe+HuangYou&family=Noto+Sans+SC:wght@400;500;700&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./css/site.css">
</head>
<body>
<header class="site-head">
  <div class="container site-head-in">
    <a class="brand" href="./index.html"><span class="brand-name">校味</span><span class="brand-pix">CAMPUS EATS</span></a>
    <form class="search" action="./search.html"><input type="search" placeholder="搜索店名或菜名"><button type="submit">搜索</button></form>
    <nav class="head-nav">
      <a href="./index.html">首页</a>
      <a href="./orders.html" aria-current="page">我的订单</a>
      <a href="./address.html">地址管理</a>
      <a href="./login.html">退出</a>
    </nav>
  </div>
</header>

<main class="container">
  <div class="checkout-grid">
    <div style="display: grid; gap: var(--space-lg);">
      <p style="font-size: var(--text-sm);"><a href="./shop.html" style="color: var(--color-accent); text-decoration: none;">&lt; 返回茶百道</a></p>

      <section class="panel">
        <h2 class="panel-head">收货地址</h2>
        <div class="panel-body">
          <label class="addr-opt checked">
            <input type="radio" name="addr" checked>
            <span><span class="addr-name">张三</span> <span class="addr-tel">138****1234</span><span class="tag">默认</span><br><span style="font-size: var(--text-sm); color: var(--color-ink-2);">1 号宿舍楼 302（楼下货架自取）</span></span>
          </label>
          <label class="addr-opt">
            <input type="radio" name="addr">
            <span><span class="addr-name">李四</span> <span class="addr-tel">139****5678</span><br><span style="font-size: var(--text-sm); color: var(--color-ink-2);">5 号宿舍楼 108</span></span>
          </label>
          <a class="btn btn-ghost btn-sm" href="./address.html">+ 新增地址</a>
        </div>
      </section>

      <section class="panel">
        <h2 class="panel-head">订单备注</h2>
        <div class="panel-body">
          <div class="field">
            <label for="note">给店家或配送的话（选填）</label>
            <textarea id="note" rows="2" placeholder="比如：珍珠换椰果，放楼下货架第三层"></textarea>
          </div>
        </div>
      </section>

      <button class="btn" style="justify-self: start;">(coin) 模拟支付 ¥41</button>
    </div>

    <aside class="panel" aria-label="订单摘要">
      <h2 class="panel-head">订单摘要 · 茶百道</h2>
      <div class="panel-body">
        <div class="summary-line"><span>招牌杨枝甘露 x1</span><span class="price"><span class="yen">¥</span>16</span></div>
        <div class="summary-line"><span>珍珠奶茶 x2</span><span class="price"><span class="yen">¥</span>24</span></div>
        <div class="summary-line"><span>配送费</span><span class="price"><span class="yen">¥</span>1</span></div>
        <div class="summary-line summary-total"><span>合计</span><span class="price price-big"><span class="yen">¥</span>41</span></div>
        <p style="font-size: var(--text-xs); color: var(--color-muted);">以商家现价结算 · 支付即出票，票号可在订单页查询</p>
      </div>
    </aside>
  </div>
</main>

<footer class="site-foot">
  <div class="container site-foot-in">
    <div>
      <span class="brand-name">校味</span> <span class="brand-pix">CAMPUS EATS</span>
      <small>全栈课程设计作品 · 视觉稿 v1</small>
    </div>
    <small style="margin-top:0;">主题：像素×温馨</small>
  </div>
</footer>
</body>
</html>
